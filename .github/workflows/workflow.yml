name: LatentSync 1.5 Cloud Inference

on:
  workflow_dispatch:

jobs:
  prepare-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Cache Python Virtual Environment
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-v1

      - name: Cache Model Checkpoints
        id: cache-checkpoints
        uses: actions/cache@v4
        with:
          path: checkpoints
          key: checkpoints-latentsync-1.5-v1

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python Dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install -r requirements.txt

      - name: Pre-download Checkpoints & Clone Repository
        if: steps.cache-checkpoints.outputs.cache-hit != 'true'
        run: |
          .venv/bin/python -c "from inference_utils import download_latentsync_checkpoints, ensure_latentsync_repository; download_latentsync_checkpoints('checkpoints'); ensure_latentsync_repository('LatentSync')"

  run-latentsync:
    needs: prepare-assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Restore Model Checkpoints
        uses: actions/cache@v4
        with:
          path: checkpoints
          key: checkpoints-latentsync-1.5-v1

      - name: Restore Python Virtual Environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-v1

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsm6 libxext6

      - name: Create 12GB Swap Space for CPU RAM Optimization
        run: |
          echo "Allocating 12GB swap space for LatentSync CPU execution..."
          sudo fallocate -l 12G /swapfile_latentsync || sudo dd if=/dev/zero of=/swapfile_latentsync bs=1M count=12288
          sudo chmod 600 /swapfile_latentsync
          sudo mkswap /swapfile_latentsync
          sudo swapon /swapfile_latentsync
          free -h

      - name: Run LatentSync 1.5 Threadmaxed Inference
        run: |
          export OMP_NUM_THREADS=$(nproc)
          export MKL_NUM_THREADS=$(nproc)
          export OPENBLAS_NUM_THREADS=$(nproc)
          export VECLIB_MAXIMUM_THREADS=$(nproc)
          export NUMEXPR_NUM_THREADS=$(nproc)
          export TORCH_NUM_THREADS=$(nproc)
          .venv/bin/python server.py

      - name: Upload Synced Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: synced-video
          path: output.mp4
          if-no-files-found: error
